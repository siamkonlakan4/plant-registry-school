name: Publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test && npm run build
        env:
          VITE_FRONTEND_URL: ${{ vars.VITE_FRONTEND_URL }}
          VITE_APPS_SCRIPT_URL: ${{ vars.VITE_APPS_SCRIPT_URL }}
          VITE_ADMIN_URL: ${{ vars.VITE_ADMIN_URL }}
          VITE_ENABLE_DEMO_MODE: ${{ vars.VITE_ENABLE_DEMO_MODE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
