<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_top"><title>จัดการทะเบียนพรรณไม้</title><style>
:root{--purple:#6246b5;--soft:#f0ebff;--ink:#322b42;--border:#e6e0f2}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#faf9ff;font:16px/1.55 Arial,Tahoma,sans-serif}header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 5%;background:white;border-bottom:1px solid var(--border)}header strong{color:var(--purple)}nav{display:flex;gap:7px;flex-wrap:wrap}button,.btn{background:var(--purple);color:#fff;border:0;border-radius:10px;padding:10px 15px;font:inherit;cursor:pointer;text-decoration:none}button:hover{background:#49318e}button:disabled{opacity:.45}button.alt{background:var(--soft);color:var(--purple)}button.danger{background:#c84d63}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #bca6ff}main{max-width:1200px;margin:28px auto;padding:0 18px}h1{font-size:clamp(25px,4vw,36px)}.panel{background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 8px 30px #322b420a}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{display:block;font-weight:600}input,select,textarea{display:block;width:100%;border:1px solid var(--border);border-radius:10px;padding:11px;margin-top:5px;background:white;color:var(--ink);font:inherit}input[type=checkbox]{width:auto;display:inline}textarea{min-height:90px}small,.muted{color:#766f85}.card{border:1px solid var(--border);border-radius:14px;padding:18px}.tag{background:var(--soft);color:var(--purple);border-radius:7px;padding:3px 7px;font-size:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--border);text-align:left;padding:11px}#notice{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#fff;padding:12px;border-radius:10px;display:none;z-index:9}.preview img{width:100%;max-height:240px;object-fit:cover}.label-sheet{background:white;display:flex;flex-wrap:wrap;gap:4mm;padding:3mm}.label{position:relative;overflow:hidden;border:1px dashed #bbb;flex:none;background:white}.label>div{position:absolute;white-space:pre-wrap;overflow:hidden}.label canvas{width:100%!important;height:100%!important}.tools{display:flex;gap:6px;flex-wrap:wrap}.tools button{font-size:13px}.studio-wrap{display:flex;gap:20px;flex-wrap:wrap}.studio-wrap .label{box-shadow:0 10px 25px #322b4230}.layer-list{min-width:290px;max-width:420px;flex:1}.layer{border:1px solid var(--border);padding:8px;margin:5px 0;border-radius:9px;cursor:pointer}.layer.active{background:var(--soft)}@media(max-width:700px){.grid,.form{grid-template-columns:1fr}}@media print{@page{size:A4;margin:3mm}header,.noprint,h1,#notice{display:none!important}main{padding:0;margin:0}.panel{border:0;box-shadow:none;padding:0}.label-sheet{padding:0;gap:4mm}.label{break-inside:avoid}}
</style></head><body><header><strong>ระบบทะเบียนพรรณไม้ · เจ้าหน้าที่</strong><nav id="nav"><button data-page="dashboard">รายการ</button><button data-page="form">เพิ่มพรรณไม้</button><button data-page="labels">พิมพ์ป้าย</button><button data-page="studio" data-admin>สตูดิโอ</button><button data-page="media">รูปภาพ</button><button data-page="settings" data-admin>ตั้งค่า</button></nav></header><main id="root"><section class="panel">กำลังตรวจสิทธิ์บัญชีโรงเรียน...</section></main><div id="notice" role="status" aria-live="polite"></div>

<script>
'use strict';let user=null,plantList=[],templates=[],displaySettings={},currentPage='dashboard',selectedTemplate=null,studioNodes=[],studioSelection=-1;const root=document.getElementById('root');
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const notice=s=>{const n=document.getElementById('notice');n.textContent=s;n.style.display='block';setTimeout(()=>n.style.display='none',4500)};
function call(path,payload={}){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>r.success?resolve(r.data):reject(Error(r.error.message))).withFailureHandler(e=>reject(Error(e.message||'เชื่อมต่อไม่สำเร็จ'))).adminCall(path,payload))}
function loading(){root.innerHTML='<section class="panel">กำลังโหลด...</section>'}function err(e){notice(e.message);root.innerHTML='<section class="panel"><h1>ไม่สามารถเปิดหน้านี้ได้</h1><p id="error"></p></section>';root.querySelector('#error').textContent=e.message}
async function show(page,arg){currentPage=page;loading();try{if(page==='dashboard')await dashboard();if(page==='form')await form(arg);if(page==='settings')await settings();if(page==='media')await media();if(page==='labels')await labels();if(page==='studio')await studio()}catch(e){err(e)}}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));
async function dashboard(){plantList=await call('/me/plants',{pageSize:100});root.innerHTML=`<h1>ทะเบียนพรรณไม้</h1><p class="muted">${escapeHtml(user.full_name)} · ${escapeHtml(user.email)} · ${escapeHtml(user.role)}</p><div class="grid">${[['รายการทั้งหมด',plantList.length],['รอตรวจสอบ',plantList.filter(p=>p.status==='pending').length],['ยังไม่มีรูป',plantList.filter(p=>!p.cover_image_url).length]].map(([a,b])=>`<div class="panel"><h2>${b}</h2>${a}</div>`).join('')}</div><section class="panel"><div class="row"><h2>รายการล่าสุด</h2><button id="add">เพิ่มรายการ</button></div><div class="tablewrap"><table><thead><tr><th>รหัส</th><th>ชื่อพืช</th><th>สถานะ</th><th>ผู้บันทึก</th><th>จัดการ</th></tr></thead><tbody>${plantList.map(p=>`<tr><td>${escapeHtml(p.plant_code)}</td><td>${escapeHtml(p.common_name)}</td><td><span class="tag">${escapeHtml(p.status)}</span></td><td>${escapeHtml(p.recorder_name)}</td><td><button class="alt" data-edit="${escapeHtml(p.plant_id)}">แก้ไข</button></td></tr>`).join('')}</tbody></table></div></section>`;root.querySelector('#add').onclick=()=>show('form');root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>show('form',b.dataset.edit))}
async function compress(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)throw Error('รูปต้องเป็น JPG, PNG หรือ WebP ขนาดไม่เกิน 5 MB');const bitmap=await createImageBitmap(file),scale=Math.min(1,1500/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.8));return new Promise(r=>{const reader=new FileReader();reader.onload=()=>r({name:file.name.replace(/\.[^.]+$/,'.jpg'),mime:'image/jpeg',data:String(reader.result).split(',')[1],preview:String(reader.result)});reader.readAsDataURL(blob)})}
async function form(id){const p=id?await call('/me/plant',{id}):{},fields=[['plant_code','รหัสพรรณไม้'],['common_name','ชื่อพื้นเมือง'],['scientific_name','ชื่อวิทยาศาสตร์'],['family','ชื่อวงศ์'],['habit','ลักษณะวิสัย'],['key_features','ลักษณะเด่น'],['location','บริเวณที่พบ'],['zone','โซน'],['quantity','จำนวนต้น'],['latitude','ละติจูด'],['longitude','ลองจิจูด'],['notes','หมายเหตุ']];root.innerHTML=`<h1>${id?'แก้ไข':'เพิ่ม'}พรรณไม้</h1><section class="panel"><form id="plantform"><div class="form">${fields.map(([key,title])=>`<label>${title}${['notes','key_features'].includes(key)?`<textarea name="${key}">${escapeHtml(p[key])}</textarea>`:`<input name="${key}" value="${escapeHtml(p[key])}" ${key==='quantity'?'type="number" min="1"':''}>`}</label>`).join('')}</div>${user.role==='admin'?`<label>สถานะ<select name="status">${['draft','pending','published','archived'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></label>`:''}<label>รูปภาพ (JPG/PNG/WebP, 3–5 รูป สูงสุด 5 MB/รูป)<input id="pictures" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div id="pictures-preview" class="row"></div><p class="muted">รูปเดิม: ${escapeHtml(p.image_file_ids_json?JSON.parse(p.image_file_ids_json).length:0)} รูป · สามารถเพิ่มรูปได้ไม่เกิน 5 รูปรวม</p><button id="submit">บันทึก</button> ${id?'<button type="button" class="danger" id="remove">ลบรายการ</button>':''}</form></section>`;let images=[];root.querySelector('#pictures').onchange=async e=>{try{images=await Promise.all([...e.target.files].map(compress));if(images.length>5)throw Error('เกิน 5 รูป');const box=root.querySelector('#pictures-preview');box.replaceChildren(...images.map((im,i)=>{const x=document.createElement('img');x.src=im.preview;x.alt='รูป '+(i+1);x.width=90;x.height=90;return x}))}catch(e){notice(e.message)}};root.querySelector('#plantform').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));data.images=images.map(({name,mime,data})=>({name,mime,data}));const button=root.querySelector('#submit');button.disabled=true;try{await call(id?'/plants/'+id:'/plants',data);notice('บันทึกแล้ว');show('dashboard')}catch(err){notice(err.message);button.disabled=false}};if(id)root.querySelector('#remove').onclick=async()=>{if(confirm('ยืนยันลบรายการนี้?'))try{await call('/plants/'+id+'/delete');notice('ลบแล้ว');show('dashboard')}catch(e){notice(e.message)}}}
async function settings(){if(user.role!=='admin')throw Error('เฉพาะผู้ดูแล');const [s,users]=await Promise.all([call('/admin/settings'),call('/admin/users')]);const keys=[['system_name','ชื่อระบบ'],['school_name','ชื่อโรงเรียน'],['system_description','คำอธิบาย'],['admin_name','ชื่อแอดมิน'],['primary_color','สีหลัก'],['max_images_per_plant','จำนวนรูปสูงสุด'],['default_label_width_mm','ความกว้างป้าย มม.'],['default_label_height_mm','ความสูงป้าย มม.']];root.innerHTML=`<h1>ตั้งค่าระบบ</h1><section class="panel"><form id="settingsform"><div class="form">${keys.map(([k,t])=>`<label>${t}<input name="${k}" value="${escapeHtml(s[k])}"></label>`).join('')}</div><label><input type="checkbox" name="public_recorder_visibility" ${s.public_recorder_visibility==='true'?'checked':''}> แสดงชื่อผู้บันทึก</label><label>โลโก้โรงเรียน<input id="logo" type="file" accept="image/png,image/jpeg,image/webp"></label><button>บันทึก</button><p class="muted">Spreadsheet: ${escapeHtml(s.spreadsheet_id)} · Drive: ${escapeHtml(s.drive_root_folder_id)}</p></form></section><section class="panel"><h2>รายชื่อเจ้าหน้าที่</h2><div class="tablewrap"><table><tbody>${users.map(u=>`<tr><td>${escapeHtml(u.full_name)}</td><td>${escapeHtml(u.email)}</td><td>${escapeHtml(u.role)}</td><td>${u.active?'active':'inactive'}</td><td><button class="danger" data-user="${escapeHtml(u.user_id)}">ปิดสิทธิ์</button></td></tr>`).join('')}</tbody></table></div><form id="newuser" class="form"><label>ชื่อ<input name="full_name" required></label><label>อีเมล<input name="email" type="email" required></label><label>บทบาท<select name="role"><option value="staff">เจ้าหน้าที่</option><option value="admin">ผู้ดูแล</option></select></label><div><br><button>เพิ่มผู้ใช้</button></div></form></section><button id="export">สำรองข้อมูล Plants CSV</button>`;root.querySelector('#settingsform').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));d.public_recorder_visibility=String(e.currentTarget.elements.public_recorder_visibility.checked);try{if(root.querySelector('#logo').files[0]){const {data,mime}=await compress(root.querySelector('#logo').files[0]);d.school_logo={data,mime}}await call('/admin/settings',d);notice('บันทึกแล้ว')}catch(err){notice(err.message)}};root.querySelector('#newuser').onsubmit=async e=>{e.preventDefault();try{await call('/admin/users',{...Object.fromEntries(new FormData(e.currentTarget)),active:true});show('settings')}catch(err){notice(err.message)}};root.querySelectorAll('[data-user]').forEach(b=>b.onclick=async()=>{if(confirm('ปิดสิทธิ์บัญชีนี้?'))try{await call('/admin/users/'+b.dataset.user+'/delete');show('settings')}catch(e){notice(e.message)}});root.querySelector('#export').onclick=async()=>{const rows=await call('/admin/plants/export'),keys=Object.keys(rows[0]||{}).filter(k=>!k.startsWith('__'));const csv=[keys,...rows.map(r=>keys.map(k=>r[k]))].map(line=>line.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='plant-backup.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}
async function media(){const rows=await call('/admin/media');root.innerHTML=`<h1>คลังรูปภาพ</h1><section class="panel"><label>ค้นหา<input id="searchmedia" placeholder="รหัสพรรณไม้ หรือชื่อรูป"></label><div class="grid" id="media-grid">${rows.map(m=>`<div class="card media-item" data-term="${escapeHtml(m.plant_id+' '+m.file_name)}"><img width="100%" height="190" style="object-fit:cover" src="https://drive.google.com/thumbnail?id=${encodeURIComponent(m.file_id)}&sz=w400" alt="ภาพพรรณไม้"><p>${escapeHtml(m.file_name)}</p><small>${escapeHtml(m.plant_id)} · ${Math.round(Number(m.size_bytes)/1024)} KB · ${escapeHtml(m.uploaded_at)}</small></div>`).join('')}</div></section>`;root.querySelector('#searchmedia').oninput=e=>root.querySelectorAll('.media-item').forEach(x=>x.hidden=!x.dataset.term.toLowerCase().includes(e.target.value.toLowerCase()))}
function measure(t){return {width:Number(t.width_mm||100),height:Number(t.height_mm||150)}}
async function labels(){templates=await call('/admin/templates');displaySettings=await call('/me/settings');plantList=await call('/me/plants',{pageSize:100});root.innerHTML=`<h1>พิมพ์ป้ายทะเบียน</h1><section class="panel noprint"><label>Template<select id="labeltpl">${templates.map(t=>`<option value="${escapeHtml(t.template_id)}">${escapeHtml(t.template_name)}</option>`).join('')}</select></label><div class="grid">${plantList.map(p=>`<label class="card"><input type="checkbox" value="${escapeHtml(p.plant_id)}"> ${escapeHtml(p.common_name)} <small>${escapeHtml(p.plant_code)}</small></label>`).join('')}</div><p><button id="preview">แสดงตัวอย่าง</button> <button id="print" disabled>พิมพ์ A4 / บันทึก PDF</button></p></section><section class="panel"><div id="label-sheet" class="label-sheet"></div></section>`;let selected=[];root.querySelector('#preview').onclick=async()=>{selected=[...root.querySelectorAll('input:checked')].map(i=>plantList.find(p=>p.plant_id===i.value));if(!selected.length)return notice('เลือกพรรณไม้ก่อน');const t=templates.find(x=>x.template_id===root.querySelector('#labeltpl').value),m=measure(t),sheet=root.querySelector('#label-sheet');sheet.replaceChildren();for(const p of selected)await renderLabel(sheet,t,p);root.querySelector('#print').disabled=false};root.querySelector('#print').onclick=async()=>{try{await call('/admin/labels/print-log',{template_id:root.querySelector('#labeltpl').value,plant_ids:selected.map(p=>p.plant_id),output_type:'print'})}catch(e){notice(e.message)}window.print()}}
async function renderLabel(holder,t,p){const data=JSON.parse(t.template_json),m=measure(t),el=document.createElement('div');el.className='label';el.style.width=m.width+'mm';el.style.height=m.height+'mm';holder.append(el);const scale=el.clientWidth/400;for(const node of data.nodes){const div=document.createElement('div');const x=Number(node.x)||0,y=Number(node.y)||0,w=Number(node.width)||100,h=Number(node.height)||40;div.style.left=x*scale+'px';div.style.top=y*scale+'px';div.style.width=w*scale+'px';div.style.height=h*scale+'px';div.style.opacity=node.opacity??1;if(node.kind==='text'){div.textContent=String(node.text||'').replace(/{{(\w+)}}/g,(_,k)=>p[k]??(displaySettings[k]||''));div.style.fontSize=(Number(node.fontSize)||20)*scale+'px';div.style.color=node.fill||'#322b42';div.style.fontStyle=node.italic?'italic':'normal'}else if(node.kind==='qr'){const qr=document.createElement('canvas');await PlantQR.toCanvas(qr,p.qr_url,{width:Math.max(150,w*3),margin:4,color:{dark:'#000000',light:'#ffffff'}});div.append(qr)}else if(node.kind==='image'){const u=JSON.parse(p.image_urls_json||'[]')[0];if(u){const img=document.createElement('img');img.src=u;img.alt='ภาพพรรณไม้';img.style.cssText='width:100%;height:100%;object-fit:cover';div.append(img)}else div.style.background='#f0ebff'}else if(node.kind==='rect'){div.style.background=node.fill||'#f0ebff'}else if(node.kind==='circle'){div.style.background=node.fill||'#f0ebff';div.style.borderRadius='50%'}else if(node.kind==='line'){div.style.borderTop='2px solid '+(node.fill||'#6246b5')}el.append(div)}return el}
async function studio(){if(user.role!=='admin')throw Error('เฉพาะผู้ดูแล');templates=await call('/admin/templates');root.innerHTML=`<h1>สตูดิโอป้าย</h1><section class="panel noprint"><div class="row"><label>แบบป้าย<select id="studio-tpl">${templates.map(t=>`<option value="${escapeHtml(t.template_id)}">${escapeHtml(t.template_name)}</option>`).join('')}</select></label><label>ชื่อ Template<input id="studio-name"></label></div><p class="tools" id="newnodes">${[['text','ข้อความ'],['text','{{common_name}}'],['text','{{scientific_name}}'],['text','{{plant_code}}'],['image','ภาพพืช'],['qr','QR'],['rect','กรอบ']].map(([k,t])=>`<button class="alt" data-kind="${k}" data-text="${escapeHtml(t)}">+ ${escapeHtml(t)}</button>`).join('')}</p><button id="save-studio">บันทึกเป็น Template ใหม่</button></section><section class="panel studio-wrap"><div id="studio-canvas" class="label"></div><div class="layer-list"><h3>องค์ประกอบ</h3><div id="layers"></div><div id="editor"></div></div></section>`;const load=()=>{selectedTemplate=templates.find(t=>t.template_id===root.querySelector('#studio-tpl').value);root.querySelector('#studio-name').value=selectedTemplate.template_name+' (สำเนา)';studioNodes=structuredClone(JSON.parse(selectedTemplate.template_json).nodes);draw()};function draw(){const canvas=root.querySelector('#studio-canvas');canvas.style.cssText='width:400px;height:600px;position:relative;overflow:hidden;background:white';canvas.replaceChildren();studioNodes.forEach((n,i)=>{const d=document.createElement('div');d.style.cssText=`position:absolute;left:${Number(n.x)||0}px;top:${Number(n.y)||0}px;width:${Number(n.width)||120}px;height:${Number(n.height)||40}px;cursor:move;border:${i===studioSelection?'2px dashed #6246b5':'1px dotted #ddd'};background:${n.kind==='image'?'#e0f3e9':n.kind==='rect'?(n.fill||'#f0ebff'):'transparent'};color:${n.fill||'#322b42'};font-size:${n.fontSize||20}px`;d.textContent=n.kind==='qr'?'QR':n.kind==='image'?'ภาพพรรณไม้':n.text||'';d.onclick=()=>{studioSelection=i;draw()};d.onpointerdown=e=>{studioSelection=i;const sx=e.clientX,sy=e.clientY,ox=Number(n.x)||0,oy=Number(n.y)||0;d.setPointerCapture(e.pointerId);d.onpointermove=v=>{n.x=Math.max(0,ox+v.clientX-sx);n.y=Math.max(0,oy+v.clientY-sy);d.style.left=n.x+'px';d.style.top=n.y+'px'};d.onpointerup=()=>{d.onpointermove=null;draw()}};canvas.append(d)});root.querySelector('#layers').innerHTML=studioNodes.map((n,i)=>`<div class="layer ${i===studioSelection?'active':''}" data-layer="${i}">${i+1}. ${escapeHtml(n.text||n.kind)}</div>`).join('');root.querySelectorAll('[data-layer]').forEach(x=>x.onclick=()=>{studioSelection=Number(x.dataset.layer);draw()});const editor=root.querySelector('#editor');editor.innerHTML=studioSelection<0?'เลือกองค์ประกอบเพื่อแก้ไข':`<h3>แก้ไของค์ประกอบ</h3>${[['text','ข้อความ'],['x','X'],['y','Y'],['width','กว้าง'],['height','สูง'],['fontSize','ขนาดอักษร'],['fill','สี']].map(([k,l])=>`<label>${l}<input data-prop="${k}" value="${escapeHtml(studioNodes[studioSelection][k]??'')}"></label>`).join('')}<button class="danger" id="delete-node">ลบวัตถุ</button>`;editor.querySelectorAll('[data-prop]').forEach(x=>x.onchange=e=>{const k=e.target.dataset.prop;studioNodes[studioSelection][k]=['x','y','width','height','fontSize'].includes(k)?Number(e.target.value):e.target.value;draw()});if(studioSelection>=0)editor.querySelector('#delete-node').onclick=()=>{studioNodes.splice(studioSelection,1);studioSelection=-1;draw()}}root.querySelector('#studio-tpl').onchange=load;root.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{const kind=b.dataset.kind,text=b.dataset.text;studioNodes.push({kind,text:kind==='text'?text:'',source:kind==='image'?'plant_image':'',x:30,y:80,width:kind==='qr'?110:260,height:kind==='qr'?110:50,fontSize:22,fill:'#322b42'});studioSelection=studioNodes.length-1;draw()});root.querySelector('#save-studio').onclick=async()=>{if(studioNodes.some(n=>n.kind==='qr'&&Math.min(n.width,n.height)<100))return notice('QR ต้องมีขนาดอย่างน้อย 25 มม.');try{await call('/admin/templates',{template_name:root.querySelector('#studio-name').value,description:'แบบป้ายโรงเรียน',width_mm:selectedTemplate.width_mm,height_mm:selectedTemplate.height_mm,template_json:{version:1,nodes:studioNodes}});notice('บันทึก Template แล้ว')}catch(e){notice(e.message)}};load()}
call('/me').then(u=>{user=u;document.querySelectorAll('[data-admin]').forEach(b=>b.hidden=u.role!=='admin');show('dashboard')}).catch(err);
</script></body></html>
